name: Validate and deploy FastFigure

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    concurrency:
      group: validate-fastfigure-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint && pnpm test && pnpm run build
      - run: node --test tests/production.mjs
      - run: pnpm prune --prod --ignore-scripts
      - name: Checkout pinned FastDeploy packager
        uses: actions/checkout@v4
        with:
          repository: FastR-D/FastDeploy
          ref: cc223a0b83b0ef2389974dd70a4b74148cd1af87
          path: .fastdeploy-tools
          persist-credentials: false
      - name: Package the tested runtime
        run: python3 .fastdeploy-tools/scripts/package.py fastfigure --output "$RUNNER_TEMP/fastfigure-release"
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ github.sha }}
          path: ${{ runner.temp }}/fastfigure-release/
          if-no-files-found: error
          retention-days: 7

  deploy:
    needs: validate
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    uses: FastR-D/FastDeploy/.github/workflows/deploy.yml@cc223a0b83b0ef2389974dd70a4b74148cd1af87
    with:
      app: fastfigure
      artifact-name: release-${{ github.sha }}
      # These values are literal KEY=value entries; do not add shell quotes.
      # Code-relative paths are supplied by the trusted FastDeploy server profile.
      runtime-env: |
        FASTFIGURE_LIBRARY_DIR=/home/dev/fastfigure-shared/components
        HOST=127.0.0.1
        NODE_ENV=production
        PORT=5178
    secrets:
      SSH_HOST: ${{ secrets.FASTRD_SSH_HOST }}
      SSH_PORT: ${{ secrets.FASTRD_SSH_PORT }}
      SSH_USER: ${{ secrets.FASTRD_SSH_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.FASTRD_SSH_PRIVATE_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.FASTRD_SSH_KNOWN_HOSTS }}
      runtime-secrets: '{}'
